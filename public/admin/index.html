<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>글쓰기 · Luca's development diary</title>
		<link rel="icon" href="/blog/favicon.svg" type="image/svg+xml" />
		<style>
			/* Editor pane: a big title box and a roomier body, like a blog editor.
			   Fields carry data-key-path; Sveltia's own class names change between releases. */
			section[data-key-path='title'] input {
				font-size: 1.6em !important;
				font-weight: 700 !important;
				padding-block: 0.4em !important;
			}
			section[data-key-path='body'] [contenteditable='true'] {
				font-size: 16px !important;
				line-height: 1.8 !important;
				min-height: 60vh !important;
			}
		</style>
	</head>
	<body>
		<!-- Web editor for posts/ (Sveltia CMS). Settings are in config.yml next to this file. -->
		<script src="https://unpkg.com/@sveltia/cms@0.262.1/dist/sveltia-cms.js"></script>
		<script>
			// The preview pane uses the blog's post look (preview.css next to this file).
			CMS.registerPreviewStyle('preview.css');

			// Photos uploaded in the "사진 올리기" field go into the body on save: each fills the next
			// empty `![]()` (what the image button inserts in Markdown mode), or goes at the end.
			// The field itself is not saved.
			CMS.registerEventListener({
				name: 'preSave',
				handler: ({ entry }) => {
					const data = entry.get('data');
					const value = data.get('photos');
					const photos = (value?.toJS ? value.toJS() : (value ?? [])).filter(Boolean);
					let body = data.get('body') ?? '';
					for (const src of photos) {
						if (body.includes(`](${src})`)) continue;
						if (body.includes('![]()')) body = body.replace('![]()', `![](${src})`);
						else body = `${body.trimEnd()}\n\n![](${src})\n`;
					}
					return data.set('body', body).delete('photos');
				},
			});
		</script>
	</body>
</html>
