<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>글쓰기 · Luca's development diary</title>
		<link rel="icon" href="/blog/favicon.svg" type="image/svg+xml" />
		<style>
			/* Editor pane: a big title box and a roomier body, like a blog editor.
			   Fields carry data-key-path; Sveltia's own class names change between releases. */
			section[data-key-path='title'] input {
				font-size: 1.6em !important;
				font-weight: 700 !important;
				padding-block: 0.4em !important;
			}
			section[data-key-path='body'] [contenteditable='true'] {
				font-size: 16px !important;
				line-height: 1.8 !important;
				min-height: 60vh !important;
			}
		</style>
	</head>
	<body>
		<!-- Web editor for posts/ (Sveltia CMS). Settings are in config.yml next to this file. -->
		<script src="https://unpkg.com/@sveltia/cms@0.262.1/dist/sveltia-cms.js"></script>
		<!-- For the preview: KaTeX (same version as the site) and the site's Markdown fixes -->
		<script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
		<script src="markdown-fixes.js"></script>
		<script>
			// The preview pane uses the blog's post look (preview.css next to this file).
			CMS.registerPreviewStyle('preview.css');
			CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css');

			// The preview shows a post the way the site does: the same Markdown fixes (\( \) math, bold
			// next to Korean), then math through KaTeX. Sveltia's own preview has no math.
			(() => {
				const { h, marked, DOMPurify, katex, markdownFixes } = window;

				function renderBody(markdown, getAsset) {
					const { text, math } = markdownFixes.protectMath(markdownFixes.fixMarkdown(markdown));
					const html = DOMPurify.sanitize(marked.parse(text, { gfm: true }));
					// a formula alone in its paragraph is a block, as on the site
					const withMath = html.replace(/<p[^>]*>@@math(\d+)@@<\/p>|@@math(\d+)@@/g, (_, block, inline) =>
						katex.renderToString(math[Number(block ?? inline)].tex, {
							displayMode: block !== undefined,
							throwOnError: false,
						}),
					);
					// ../images/… paths through the editor, which knows saved and not-yet-saved files
					const doc = new DOMParser().parseFromString(withMath, 'text/html');
					doc.querySelectorAll('img[src]').forEach((img) => {
						const src = img.getAttribute('src');
						if (/^(?:[a-z]+:|\/\/)/i.test(src)) return;
						const url = getAsset(src)?.url;
						if (url) img.setAttribute('src', url);
					});
					return doc.body.innerHTML;
				}

				const PostPreview = ({ entry, getAsset }) => {
					const title = entry.getIn(['data', 'title']) || '';
					const tags = entry.getIn(['data', 'tags'])?.toJS?.() ?? [];
					return h(
						'article',
						null,
						title ? h('h1', { className: 'preview-title' }, title) : null,
						tags.length ? h('p', { className: 'preview-tags' }, tags.map((tag) => `#${tag}`).join('  ')) : null,
						h('div', {
							className: 'prose',
							dangerouslySetInnerHTML: { __html: renderBody(entry.getIn(['data', 'body']) ?? '', getAsset) },
						}),
					);
				};

				// every collection in config.yml
				['dev', 'ctf', 'bugbounty', 'docs', 'papers', 'contests', 'cs', 'security', 'db', 'language', 'algorithm', 'math', 'ai', 'drafts'].forEach(
					(name) => CMS.registerPreviewTemplate(name, PostPreview),
				);
			})();

			// Photos uploaded in the "사진 올리기" field go into the body on save: each fills the next
			// empty `![]()` (what the image button inserts in Markdown mode), or goes at the end.
			// The field itself is not saved.
			CMS.registerEventListener({
				name: 'preSave',
				handler: ({ entry }) => {
					const data = entry.get('data');
					const value = data.get('photos');
					const photos = (value?.toJS ? value.toJS() : (value ?? [])).filter(Boolean);
					let body = data.get('body') ?? '';
					for (const src of photos) {
						if (body.includes(`](${src})`)) continue;
						if (body.includes('![]()')) body = body.replace('![]()', `![](${src})`);
						else body = `${body.trimEnd()}\n\n![](${src})\n`;
					}
					return data.set('body', body).delete('photos');
				},
			});

			// Dragging or pasting images into the body in Markdown mode (a plain textarea, which has no
			// upload of its own): each image is renamed to a date-time name, handed to the "사진 올리기"
			// field to upload, and its final link goes in at the cursor.
			(() => {
				const bodyBox = (target) => target?.closest?.('section[data-key-path="body"]') && target.tagName === 'TEXTAREA' ? target : null;
				const imagesOf = (list) => [...(list ?? [])].filter((file) => file.type.startsWith('image/'));
				const pad = (n, width = 2) => String(n).padStart(width, '0');
				let count = 0;

				// Until the post is saved, ../images/<new file> is not in the repo, so the preview's
				// <img> points at nothing. Show the browser's own copy of the file there instead,
				// re-applied whenever the preview (an iframe) redraws.
				const previews = new Map(); // file name -> blob: URL
				const swap = (doc) => {
					if (!previews.size) return;
					doc.querySelectorAll('img').forEach((img) => {
						const url = previews.get((img.getAttribute('src') ?? '').split('/').pop());
						if (url) img.src = url;
					});
				};
				const watched = new WeakSet();
				const watchFrame = (frame) => {
					const hook = () => {
						const doc = frame.contentDocument;
						if (!doc || watched.has(doc)) return;
						watched.add(doc);
						new MutationObserver(() => swap(doc)).observe(doc, {
							childList: true,
							subtree: true,
							attributes: true,
							attributeFilter: ['src'],
						});
						swap(doc);
					};
					frame.addEventListener('load', hook);
					hook();
				};
				new MutationObserver((records) => {
					for (const { addedNodes } of records) {
						for (const node of addedNodes) {
							if (node.nodeName === 'IFRAME') watchFrame(node);
							else if (node.querySelectorAll) node.querySelectorAll('iframe').forEach(watchFrame);
						}
					}
				}).observe(document.body, { childList: true, subtree: true });

				// Once saved, the files are in the repo and the editor shows them itself.
				CMS.registerEventListener({
					name: 'postSave',
					handler: () => {
						previews.forEach((url) => URL.revokeObjectURL(url));
						previews.clear();
					},
				});

				function insert(textarea, files) {
					const upload = document.querySelector('section[data-key-path="photos"] input[type="file"]');
					if (!upload) return false;
					const now = new Date();
					const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
					const renamed = files.map((file) => {
						const ext = (file.name.match(/\.[a-z0-9]+$/i)?.[0] ?? `.${file.type.split('/')[1] || 'png'}`).toLowerCase();
						return new File([file], `${stamp}-${++count}${ext}`, { type: file.type });
					});
					renamed.forEach((file) => previews.set(file.name, URL.createObjectURL(file)));
					const list = new DataTransfer();
					renamed.forEach((file) => list.items.add(file));
					upload.files = list.files;
					upload.dispatchEvent(new Event('change', { bubbles: true }));
					// each link on a line of its own
					const before = textarea.value.slice(0, textarea.selectionStart);
					const after = textarea.value.slice(textarea.selectionEnd);
					const links =
						(before && !before.endsWith('\n') ? '\n\n' : '') +
						renamed.map((file) => `![](../images/${file.name})`).join('\n\n') +
						(after && !after.startsWith('\n') ? '\n\n' : '');
					textarea.focus();
					// insertText keeps the browser's undo and tells the editor the text changed
					if (!document.execCommand('insertText', false, links)) {
						textarea.setRangeText(links, textarea.selectionStart, textarea.selectionEnd, 'end');
						textarea.dispatchEvent(new Event('input', { bubbles: true }));
					}
					return true;
				}

				document.addEventListener('paste', (event) => {
					const textarea = bodyBox(event.target);
					const files = imagesOf(event.clipboardData?.files);
					if (textarea && files.length && insert(textarea, files)) event.preventDefault();
				}, true);
				document.addEventListener('dragover', (event) => {
					if (bodyBox(event.target) && [...(event.dataTransfer?.types ?? [])].includes('Files')) event.preventDefault();
				}, true);
				document.addEventListener('drop', (event) => {
					const textarea = bodyBox(event.target);
					const files = imagesOf(event.dataTransfer?.files);
					if (!textarea || !files.length) return;
					event.preventDefault();
					// put the cursor where the image was dropped, where the browser can tell
					const spot = document.caretPositionFromPoint?.(event.clientX, event.clientY);
					if (spot?.offsetNode === textarea) textarea.setSelectionRange(spot.offset, spot.offset);
					insert(textarea, files);
				}, true);
			})();
		</script>
	</body>
</html>
