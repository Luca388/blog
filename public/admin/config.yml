# Web editor at /blog/admin/ (Sveltia CMS). Saving commits to main, which deploys the site.
# Sign in with a GitHub token that can write to this repo; nobody else can save.
backend:
  name: github
  repo: Luca388/blog
  branch: main
  commit_messages:
    create: "{{slug}} 추가"
    update: "{{slug}} 수정"
    delete: "{{slug}} 삭제"
    uploadMedia: "{{path}} 업로드"
    deleteMedia: "{{path}} 삭제"

# Look: name and logo on the sign-in page and header, and the "view site" link.
app_title: "Luca's development diary · 글쓰기"
logo:
  src: /blog/favicon.svg
site_url: https://luca388.github.io/blog
display_url: https://luca388.github.io/blog/

# Images go to posts/images/. The links posts use (../images/<file>, same as images pasted in
# VS Code/Obsidian) are set per collection, since relative paths are only allowed there.
media_folder: /posts/images
media_libraries:
  default:
    config:
      slugify_filename: true

# Keep Korean in file names; the URL is the file name without the date (see src/lib/posts.ts).
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"
  lowercase: false

output:
  # An empty title would otherwise be saved as `title: ""`.
  omit_empty_optional_fields: true

# One collection per category folder. Keep in sync with CATEGORIES (order, names) and
# CATEGORY_INFO (descriptions) in src/consts.ts. The sidebar shows Activity, a line, then Study Notes.
# 개발 comes first because it defines the shared settings (&…) the others reuse.
# Icons are Material Symbols names: https://fonts.google.com/icons
collections:
  # ── Activity ─────────────────────────────────────────────────────────
  - name: dev
    label: "개발"
    label_singular: "개발 글"
    description: "직접 만든 프로젝트와 도구의 제작기"
    icon: code
    folder: "posts/개발"
    create: true
    slug: &slug "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Drafts are marked in the list.
    summary: &summary "{{title}}{{draft | ternary(' `임시 저장`', '')}}"
    # The file name starts with the date, so sorting by it is newest first.
    sortable_fields: &sort
      - { field: slug, label: "날짜", default_sort: desc }
      - { field: title, label: "제목" }
      - { field: commit_date, label: "마지막 수정" }
    view_filters: &filters
      - { label: "임시 저장한 글", field: draft, pattern: true }
    view_groups: &groups
      - { label: "연도", field: slug, pattern: '^\d{4}' }
    media_folder: ../images
    public_folder: ../images
    fields:
      - &f_title
        name: title
        label: 제목
        widget: string
        required: false
        hint: 비워 두면 본문 첫 줄의 `# 제목`을 써요. 파일명(주소)은 처음 저장할 때 제목으로 정해져요.
      - &f_tags
        name: tags
        label: 태그
        widget: list
        required: false
      - name: project
        label: "프로젝트 정보 (글 위에 요약 박스로 표시)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: repo, label: "저장소 URL", widget: string, required: false }
          - { name: demo, label: "데모 URL", widget: string, required: false }
          - { name: stack, label: "기술 스택", widget: list, required: false }
          - { name: period, label: "기간", widget: string, required: false, hint: "예: 2026.09 ~ 2026.10" }
      # Markdown mode has no upload, so photos are uploaded here: images dragged or pasted into the
      # body come here (script in index.html), and on save this field is dropped from the post.
      - &f_photos
        name: photos
        label: 사진 올리기
        widget: image
        multiple: true
        required: false
        preview: false
        hint: "본문에 사진을 끌어다 놓거나 붙여넣으면 여기로 올라가고 커서 자리에 링크가 들어가요. 여기에 직접 올린 사진은 저장할 때 본문의 빈 `![]()`를 순서대로 채워요(없으면 글 끝)."
      - &f_body
        name: body
        label: 본문
        widget: markdown
        # Opens as Markdown (the preview on the right shows how it looks). The M↓ button
        # switches to rich text, which rewrites the Markdown: it escapes `*` inside $math$, for one.
        modes: [raw, rich_text]
        editor_components: [code-block, image, table, hr]
      - &f_draft
        name: draft
        label: 임시 저장 (사이트에 안 보임)
        widget: boolean
        required: false
        default: false
  - name: ctf
    label: "CTF/Wargame"
    label_singular: "풀이"
    description: "CTF 대회와 워게임 문제 풀이 write-up"
    icon: flag
    folder: "posts/CTF-Wargame"
    create: true
    slug: *slug
    summary: *summary
    sortable_fields: *sort
    view_filters: *filters
    view_groups: *groups
    media_folder: ../images
    public_folder: ../images
    fields:
      - *f_title
      - *f_tags
      - name: ctf
        label: "문제 정보 (글 위에 요약 박스로 표시)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: platform, label: "플랫폼", widget: string, required: false, hint: "Dreamhack 등" }
          - { name: event, label: "대회 이름", widget: string, required: false, hint: "CTF 대회일 때" }
          - { name: field, label: "분야", widget: select, required: false, options: [pwn, rev, web, crypto, forensics, misc] }
          - { name: difficulty, label: "난이도", widget: string, required: false }
          - { name: solved, label: "푼 날짜", widget: datetime, required: false, time_format: false, format: "YYYY-MM-DD" }
          - { name: link, label: "문제 링크", widget: string, required: false }
      - *f_photos
      - *f_body
      - *f_draft
  - name: bugbounty
    label: "Bug Bounty"
    label_singular: "리포트"
    description: "취약점 탐색과 제보 경험, 공개된 리포트 정리"
    icon: bug_report
    folder: "posts/BugBounty"
    create: true
    slug: *slug
    summary: *summary
    sortable_fields: *sort
    view_filters: *filters
    view_groups: *groups
    media_folder: ../images
    public_folder: ../images
    fields:
      - *f_title
      - *f_tags
      - name: bugbounty
        label: "제보 정보 (글 위에 요약 박스로 표시)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: target, label: "대상", widget: string, required: false }
          - { name: platform, label: "플랫폼", widget: string, required: false }
          - { name: type, label: "취약점 유형", widget: string, required: false, hint: "XSS, IDOR 등" }
          - { name: severity, label: "심각도", widget: select, required: false, options: [Critical, High, Medium, Low, Info] }
          - { name: status, label: "상태", widget: select, required: false, options: [제보, 확인, 패치, 공개] }
          - { name: reported, label: "제보일", widget: datetime, required: false, time_format: false, format: "YYYY-MM-DD" }
          - { name: link, label: "공개 리포트 / CVE 링크", widget: string, required: false }
      - *f_photos
      - *f_body
      - *f_draft
  - name: docs
    label: "블로그/기술문서"
    label_singular: "문서"
    description: "기술 개념과 도구 사용법을 문서처럼 정리"
    icon: description
    folder: "posts/블로그-기술문서"
    create: true
    slug: *slug
    summary: *summary
    sortable_fields: *sort
    view_filters: *filters
    view_groups: *groups
    media_folder: ../images
    public_folder: ../images
    # The plain fields every category without extra info uses.
    fields: &fields
      - *f_title
      - *f_tags
      - *f_photos
      - *f_body
      - *f_draft
  - name: papers
    label: "논문/컨퍼런스"
    label_singular: "논문 · 발표 글"
    description: "보안 논문과 컨퍼런스 발표를 읽고 요약"
    icon: menu_book
    folder: "posts/논문-컨퍼런스"
    create: true
    slug: *slug
    summary: *summary
    sortable_fields: *sort
    view_filters: *filters
    view_groups: *groups
    media_folder: ../images
    public_folder: ../images
    fields:
      - *f_title
      - *f_tags
      - name: paper
        label: "논문/발표 정보 (글 위에 요약 박스로 표시)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: kind, label: "종류", widget: select, required: false, options: [논문, 발표, 참관 후기] }
          - { name: venue, label: "학회 / 행사", widget: string, required: false }
          - { name: authors, label: "저자 / 발표자", widget: string, required: false }
          - { name: link, label: "원문 링크", widget: string, required: false }
      - *f_photos
      - *f_body
      - *f_draft
  - name: contests
    label: "공모전/자격증"
    label_singular: "공모전 · 자격증 글"
    description: "공모전 참가와 자격증 준비 과정, 결과"
    icon: workspace_premium
    folder: "posts/공모전-자격증"
    create: true
    slug: *slug
    summary: *summary
    sortable_fields: *sort
    view_filters: *filters
    view_groups: *groups
    media_folder: ../images
    public_folder: ../images
    fields:
      - *f_title
      - *f_tags
      - name: achievement
        label: "공모전/자격증 정보 (글 위에 요약 박스로 표시)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: kind, label: "종류", widget: select, required: false, options: [자격증, 공모전, 해커톤] }
          - { name: name, label: "이름", widget: string, required: false }
          - { name: organizer, label: "주최", widget: string, required: false }
          - { name: result, label: "결과", widget: string, required: false, hint: "합격, 수상, 준비 중 등" }
          - { name: date, label: "날짜", widget: datetime, required: false, time_format: false, format: "YYYY-MM-DD" }
      - *f_photos
      - *f_body
      - *f_draft

  # ── Study Notes ──────────────────────────────────────────────────────
  - divider: true
  - { name: cs, label: CS, description: "운영체제, 컴퓨터 구조, 네트워크", icon: memory, folder: posts/CS, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
  - { name: security, label: Security, description: "리버싱, 윈도우 내부 구조, 시스템 해킹, 암호", icon: shield, folder: posts/Security, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
  - { name: db, label: DB, description: "데이터 모델링과 SQL", icon: database, folder: posts/DB, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
  - { name: language, label: Language, description: "C, 어셈블리, 개발 환경", icon: terminal, folder: posts/Language, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
  - { name: algorithm, label: Algorithm, description: "자료구조와 알고리즘 문제 풀이", icon: account_tree, folder: posts/Algorithm, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
  - { name: math, label: Math, description: "대수, 정수론 등 수학 정리", icon: functions, folder: posts/Math, create: true, slug: *slug, summary: *summary, sortable_fields: *sort, view_filters: *filters, view_groups: *groups, media_folder: ../images, public_folder: ../images, fields: *fields }
