name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # post dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refresh the GitHub profile picture (account id 121554470); on any failure the saved one stays.
      - name: Refresh profile picture
        run: |
          if curl -fsSL --max-time 20 "https://avatars.githubusercontent.com/u/121554470?v=4&s=192" -o "$RUNNER_TEMP/avatar"; then
            mv "$RUNNER_TEMP/avatar" src/assets/avatar.jpg
          else
            echo "::warning::Could not download the profile picture; using the saved one"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
